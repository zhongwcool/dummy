<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>本机文件下载</title>
<style>
html { color-scheme: light dark; }
body {
  max-width: 72em;
  margin: 0 auto;
  padding: 1.5rem;
  font-family: Tahoma, Verdana, Arial, sans-serif;
  line-height: 1.5;
}
h1 { font-size: 1.35rem; margin-top: 0; }
section { margin-top: 1.75rem; }
section.long-text-item { margin-top: 0.45rem; }
section.long-text-item:first-child { margin-top: 0.3rem; }
ul { padding-left: 1.25rem; margin: 0.5rem 0 0; }
li { margin: 0.35rem 0; }
a { word-break: break-all; }
.msg { color: #666; }
@media (prefers-color-scheme: dark) {
  .msg { color: #aaa; }
}
.err { color: #c42; }
.loading { opacity: 0.7; }

.layout {
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
  gap: 1.5rem;
  align-items: start;
  margin-top: 1rem;
}
.layout__col section:first-child { margin-top: 0; }
@media (max-width: 980px) {
  body { max-width: 42em; }
  .layout { grid-template-columns: 1fr; }
}

/* License 复制条（样式参考常见「一行命令 + 复制」组件） */
.copy-snippet {
  display: flex;
  align-items: stretch;
  gap: 0.5rem;
  margin-top: 0.5rem;
  padding: 0.65rem 0.75rem 0.65rem 1rem;
  border: 1px solid rgba(0, 0, 0, 0.12);
  border-radius: 9999px;
  background: rgba(255, 255, 255, 0.85);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
}
.copy-snippet__text {
  flex: 1;
  min-width: 0;
  margin: 0;
  padding: 0.15rem 0;
  font-family: ui-monospace, "Cascadia Code", "Consolas", monospace;
  font-size: 0.85rem;
  line-height: 1.45;
  color: #3b2b5c;
  overflow-x: auto;
  white-space: nowrap;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
}
.copy-snippet__btn {
  flex-shrink: 0;
  align-self: center;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2.25rem;
  height: 2.25rem;
  margin: -0.15rem -0.25rem -0.15rem 0;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: transparent;
  color: #666;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.copy-snippet__btn:hover {
  background: rgba(0, 0, 0, 0.06);
  color: #333;
}
.copy-snippet__btn:active {
  background: rgba(0, 0, 0, 0.1);
}
.copy-snippet__btn:focus-visible {
  outline: 2px solid #6464e8;
  outline-offset: 2px;
}
.copy-snippet__btn.is-done {
  color: #2a8f47;
}
.copy-feedback {
  margin: 0.08rem 0 0 0.2rem;
  font-size: 0.75rem;
  color: #2a8f47;
  min-height: 0.85em;
}
.copy-feedback.is-err { color: #c42; }
.copy-multiline {
  display: flex;
  flex-direction: column;
  margin-top: 0.5rem;
  padding: 0.62rem 0.7rem;
  border: 1px solid rgba(0, 0, 0, 0.12);
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.85);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
  position: relative;
}
.copy-multiline__btn {
  position: absolute;
  top: 0.22rem;
  right: 0.22rem;
}
.copy-multiline__text {
  margin: 0;
  padding-right: 2.35rem;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  word-break: break-word;
  font-family: ui-monospace, "Cascadia Code", "Consolas", monospace;
  font-size: 0.85rem;
  line-height: 1.5;
  color: #3b2b5c;
}
@media (prefers-color-scheme: dark) {
  .copy-snippet {
    border-color: rgba(255, 255, 255, 0.14);
    background: rgba(40, 40, 44, 0.75);
    box-shadow: none;
  }
  .copy-snippet__text { color: #c9b8e8; }
  .copy-snippet__btn { color: #aaa; }
  .copy-snippet__btn:hover {
    background: rgba(255, 255, 255, 0.08);
    color: #e0e0e0;
  }
  .copy-multiline {
    border-color: rgba(255, 255, 255, 0.14);
    background: rgba(40, 40, 44, 0.75);
    box-shadow: none;
  }
  .copy-multiline__text { color: #c9b8e8; }
  .copy-feedback { color: #6cda8c; }
  .copy-feedback.is-err { color: #f88; }
}
</style>
</head>
<body>
<div class="layout">
  <div class="layout__col">

<h1>欢迎</h1>
<p>下面是 <code>files</code> 目录中的文件，点击即可下载。</p>

<section aria-labelledby="files-heading">
<h2 id="files-heading" style="font-size:1.1rem;">文件列表</h2>
<p id="file-list-status" class="msg loading">正在加载列表…</p>
<ul id="file-list" hidden></ul>
</section>

  </div>
  <div class="layout__col">
    <section aria-labelledby="lines-heading">
    <h2 id="lines-heading" style="font-size:1.1rem;">单行文本</h2>
    <p class="msg" style="margin-bottom:0">把要展示的单行内容分别保存为 <code>html/lines/*.txt</code>，页面会自动按文件数量加载并分开展示。</p>
    <div id="lines"></div>
    </section>

    <section aria-labelledby="texts-heading">
    <h2 id="texts-heading" style="font-size:1.1rem;">长文本列表</h2>
    <p class="msg" style="margin-bottom:0">用于分开展示多段长文本（自动换行），每段都支持一键复制。把要展示的内容分别保存为 <code>html/texts/*.txt</code>，页面会自动按文件数量加载显示。</p>
    <div id="long-texts"></div>
    </section>
  </div>
</div>

<script>
(function () {
  var listEl = document.getElementById('file-list');
  var statusEl = document.getElementById('file-list-status');

  function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.className = isError ? 'err' : 'msg';
  }

  fetch('/files/', { credentials: 'same-origin' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function (html) {
      var doc = new DOMParser().parseFromString(html, 'text/html');
      var anchors = doc.querySelectorAll('pre a[href]');
      var frag = document.createDocumentFragment();
      var count = 0;

      anchors.forEach(function (a) {
        var raw = a.getAttribute('href');
        if (!raw || raw === '../' || raw === '..' || raw.charAt(0) === '?') return;
        if (/\/$/.test(raw)) return;

        var label = raw;
        try {
          label = decodeURIComponent(raw);
        } catch (e) {}

        var li = document.createElement('li');
        var link = document.createElement('a');
        link.href = 'files/' + raw.replace(/^\//, '');
        link.setAttribute('download', '');
        link.textContent = label;
        li.appendChild(link);
        frag.appendChild(li);
        count++;
      });

      if (count === 0) {
        setStatus('未找到可下载文件（目录为空或无法解析列表）。请确认已重载 nginx 配置并启用了 /files/ 的 autoindex。', true);
        return;
      }

      listEl.innerHTML = '';
      listEl.appendChild(frag);
      listEl.hidden = false;
      statusEl.hidden = true;
    })
    .catch(function () {
      setStatus(
        '无法获取文件列表。请在本机 nginx 的 server 中加入 /files/ 的 autoindex（已写入 conf/nginx.conf 时执行 nginx -s reload），然后刷新本页。',
        true
      );
    });
})();
</script>
<script>
(function () {
  function bindCopy(textElId, btnId, feedbackId, idleLabel) {
    var textEl = document.getElementById(textElId);
    var btn = document.getElementById(btnId);
    var feedback = document.getElementById(feedbackId);
    if (!textEl || !btn || !feedback) return;

    var resetTimer;
    function flash(msg, ok) {
      feedback.textContent = msg;
      feedback.classList.toggle('is-err', !ok);
      if (ok) {
        btn.classList.add('is-done');
        btn.setAttribute('aria-label', '已复制');
      }
      clearTimeout(resetTimer);
      resetTimer = setTimeout(function () {
        feedback.textContent = '';
        feedback.classList.remove('is-err');
        btn.classList.remove('is-done');
        btn.setAttribute('aria-label', idleLabel);
      }, 2200);
    }

    btn.addEventListener('click', function () {
      var text = (textEl.textContent || '').trim();
      if (!text) {
        flash('没有可复制的内容', false);
        return;
      }
      function ok() {
        flash('已复制到剪贴板', true);
      }
      function fail() {
        flash('复制失败，请手动选择文本复制', false);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(ok).catch(fail);
      } else {
        var sel = window.getSelection();
        var range = document.createRange();
        range.selectNodeContents(textEl);
        sel.removeAllRanges();
        sel.addRange(range);
        try {
          document.execCommand('copy');
          ok();
        } catch (e) {
          fail();
        }
        sel.removeAllRanges();
      }
    });
  }

  function renderLinesFromList(items) {
    var host = document.getElementById('lines');
    if (!host) return;
    host.innerHTML = '';

    (items || []).forEach(function (item, idx) {
      var title = (item && item.title) ? String(item.title) : ('单行文本 ' + (idx + 1));
      var text = (item && item.text) ? String(item.text) : '';

      var section = document.createElement('section');
      section.className = 'long-text-item';
      section.setAttribute('aria-label', title);

      var h = document.createElement('h3');
      h.textContent = title;
      h.style.margin = '0.05rem 0 0.08rem';
      h.style.fontSize = '0.92rem';
      section.appendChild(h);

      var box = document.createElement('div');
      box.className = 'copy-snippet';
      box.setAttribute('role', 'group');
      box.setAttribute('aria-label', title + ' 复制区');

      var code = document.createElement('code');
      code.className = 'copy-snippet__text';
      code.id = 'sl-text-' + idx;
      code.textContent = text.replace(/\r?\n/g, ' ').trim();
      box.appendChild(code);

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'copy-snippet__btn';
      btn.id = 'sl-copy-btn-' + idx;
      btn.setAttribute('aria-label', '复制' + title);
      btn.title = '复制';
      btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
      box.appendChild(btn);

      section.appendChild(box);

      var feedback = document.createElement('p');
      feedback.className = 'copy-feedback';
      feedback.id = 'sl-copy-feedback-' + idx;
      feedback.setAttribute('aria-live', 'polite');
      section.appendChild(feedback);

      host.appendChild(section);
      bindCopy(code.id, btn.id, feedback.id, '复制' + title);
    });
  }

  function setLinesError(msg) {
    var host = document.getElementById('lines');
    if (!host) return;
    host.innerHTML = '';
    var p = document.createElement('p');
    p.className = 'err';
    p.textContent = msg;
    host.appendChild(p);
  }

  function loadLinesFromDir() {
    fetch('/lines/', { credentials: 'same-origin' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (html) {
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var anchors = doc.querySelectorAll('pre a[href]');
        var files = [];
        anchors.forEach(function (a) {
          var href = a.getAttribute('href');
          if (!href || href === '../' || href === '..' || href.charAt(0) === '?') return;
          if (/\/$/.test(href)) return;
          if (!/\.txt$/i.test(href)) return;
          files.push(href);
        });

        if (files.length === 0) {
          setLinesError('未找到可展示的单行文本文件。请把内容放到 html/lines/ 目录下，并以 .txt 结尾，然后刷新页面。');
          return;
        }

        return Promise.all(
          files.map(function (name) {
            return fetch('/lines/' + name.replace(/^\//, ''), { credentials: 'same-origin' })
              .then(function (r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.text();
              })
              .then(function (text) {
                var title = name.replace(/\.txt$/i, '');
                try { title = decodeURIComponent(title); } catch (e) {}
                return { title: title, text: text };
              });
          })
        ).then(function (items) {
          renderLinesFromList(items);
        });
      })
      .catch(function () {
        setLinesError('无法从 /lines/ 加载单行文本列表。请确认 nginx 已配置 /lines/ 的 autoindex。');
      });
  }

  function renderLongTextsFromList(items) {
    var host = document.getElementById('long-texts');
    if (!host) return;
    host.innerHTML = '';

    (items || []).forEach(function (item, idx) {
      var title = (item && item.title) ? String(item.title) : ('长文本 ' + (idx + 1));
      var text = (item && item.text) ? String(item.text) : '';

      var section = document.createElement('section');
      section.className = 'long-text-item';
      section.setAttribute('aria-label', title);

      var h = document.createElement('h3');
      h.textContent = title;
      h.style.margin = '0.05rem 0 0.08rem';
      h.style.fontSize = '0.92rem';
      section.appendChild(h);

      var box = document.createElement('div');
      box.className = 'copy-multiline';
      box.setAttribute('role', 'group');
      box.setAttribute('aria-label', title + ' 复制区');

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'copy-snippet__btn copy-multiline__btn';
      btn.id = 'lt-copy-btn-' + idx;
      btn.setAttribute('aria-label', '复制' + title);
      btn.title = '复制';
      btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
      box.appendChild(btn);

      var pre = document.createElement('pre');
      pre.className = 'copy-multiline__text';
      pre.id = 'lt-text-' + idx;
      pre.textContent = text;
      box.appendChild(pre);

      section.appendChild(box);

      var feedback = document.createElement('p');
      feedback.className = 'copy-feedback';
      feedback.id = 'lt-copy-feedback-' + idx;
      feedback.setAttribute('aria-live', 'polite');
      section.appendChild(feedback);

      host.appendChild(section);

      bindCopy(pre.id, btn.id, feedback.id, '复制' + title);
    });
  }

  function setLongTextsError(msg) {
    var host = document.getElementById('long-texts');
    if (!host) return;
    host.innerHTML = '';
    var p = document.createElement('p');
    p.className = 'err';
    p.textContent = msg;
    host.appendChild(p);
  }

  function loadLongTextsFromDir() {
    fetch('/texts/', { credentials: 'same-origin' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (html) {
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var anchors = doc.querySelectorAll('pre a[href]');
        var files = [];
        anchors.forEach(function (a) {
          var href = a.getAttribute('href');
          if (!href || href === '../' || href === '..' || href.charAt(0) === '?') return;
          if (/\/$/.test(href)) return;
          if (!/\.txt$/i.test(href)) return;
          files.push(href);
        });

        if (files.length === 0) {
          setLongTextsError('未找到可展示的文本文件。请把内容放到 html/texts/ 目录下，并以 .txt 结尾，然后刷新页面。');
          return;
        }

        return Promise.all(
          files.map(function (name) {
            return fetch('/texts/' + name.replace(/^\//, ''), { credentials: 'same-origin' })
              .then(function (r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.text();
              })
              .then(function (text) {
                var title = name.replace(/\.txt$/i, '');
                try { title = decodeURIComponent(title); } catch (e) {}
                return { title: title, text: text };
              });
          })
        ).then(function (items) {
          renderLongTextsFromList(items);
        });
      })
      .catch(function () {
        setLongTextsError('无法从 /texts/ 加载文本列表。请确认 nginx 已配置 /texts/ 的 autoindex，并且局域网访问未被防火墙拦截。');
      });
  }

  loadLinesFromDir();
  loadLongTextsFromDir();
})();
</script>
</body>
</html>
