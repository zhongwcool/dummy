<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/admin.css" rel="stylesheet">
</head>
<body>
<div class="page-shell">
<div class="admin-header">
    <h1>用户管理</h1>
    <div class="admin-actions">
        <span class="text-muted small" id="currentUser"></span>
        <button type="button" class="btn btn-dark btn-sm" id="createBtn">新建用户</button>
        <a href="/admin" class="btn btn-light btn-sm">管理首页</a>
        <button type="button" class="btn btn-outline-danger btn-sm" id="logoutBtn">退出</button>
    </div>
</div>

<div class="table-responsive surface user-panel">
    <table class="table table-hover mb-0">
        <thead>
        <tr>
            <th>用户名</th>
            <th>显示名</th>
            <th>邮箱</th>
            <th>角色</th>
            <th>最后登录</th>
            <th></th>
        </tr>
        </thead>
        <tbody id="userTable"></tbody>
    </table>
</div>
</div>

<div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="userForm">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="userModalTitle">新建用户</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editingUsername">
                    <div class="mb-3">
                        <label for="formUsername" class="form-label">用户名</label>
                        <input type="text" class="form-control" id="formUsername" required>
                    </div>
                    <div class="mb-3">
                        <label for="formDisplayName" class="form-label">显示名</label>
                        <input type="text" class="form-control" id="formDisplayName">
                    </div>
                    <div class="mb-3">
                        <label for="formEmail" class="form-label">邮箱</label>
                        <input type="email" class="form-control" id="formEmail">
                    </div>
                    <div class="mb-3">
                        <label for="formRole" class="form-label">角色</label>
                        <select class="form-select" id="formRole">
                            <option value="admin">admin</option>
                            <option value="user">user</option>
                            <option value="guest">guest</option>
                        </select>
                    </div>
                    <div class="mb-0">
                        <label for="formPassword" class="form-label" id="passwordLabel">密码</label>
                        <input type="password" class="form-control" id="formPassword" autocomplete="new-password">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/admin-common.js"></script>
<script>
    let userModal;

    document.addEventListener('DOMContentLoaded', async function () {
        const user = await requireAdminAuth();
        if (!user) return;
        fillAuthBar();
        userModal = new bootstrap.Modal(document.getElementById('userModal'));
        document.getElementById('createBtn').addEventListener('click', openCreate);
        document.getElementById('userForm').addEventListener('submit', saveUser);
        loadUsers();
    });

    async function loadUsers() {
        const tbody = document.getElementById('userTable');
        try {
            const data = await apiRequest('/api/users', {headers: authHeaders()});
            const users = data.users || [];
            if (!users.length) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-muted">暂无用户</td></tr>';
                return;
            }
            tbody.innerHTML = users.map(function (item) {
                return `
                    <tr>
                        <td>${escapeHtml(item.username)}</td>
                        <td>${escapeHtml(item.displayName || '')}</td>
                        <td>${escapeHtml(item.email || '')}</td>
                        <td>${escapeHtml(item.role || '')}</td>
                        <td>${escapeHtml(item.last_login ? new Date(item.last_login).toLocaleString() : '-')}</td>
                        <td class="text-end">
                            <button class="btn btn-outline-primary btn-sm" onclick="openEdit(decodeURIComponent('${encodeURIComponent(JSON.stringify(item))}'))">编辑</button>
                            <button class="btn btn-outline-danger btn-sm" onclick="deleteUser('${encodeURIComponent(item.username)}')">删除</button>
                        </td>
                    </tr>
                `;
            }).join('');
        } catch (error) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-danger">${escapeHtml(error.message || '加载失败')}</td></tr>`;
        }
    }

    function openCreate() {
        document.getElementById('userModalTitle').textContent = '新建用户';
        document.getElementById('editingUsername').value = '';
        document.getElementById('formUsername').value = '';
        document.getElementById('formUsername').disabled = false;
        document.getElementById('formDisplayName').value = '';
        document.getElementById('formEmail').value = '';
        document.getElementById('formRole').value = 'user';
        document.getElementById('formPassword').value = '';
        document.getElementById('formPassword').required = true;
        document.getElementById('passwordLabel').textContent = '密码';
        userModal.show();
    }

    function openEdit(raw) {
        const item = typeof raw === 'string' ? JSON.parse(raw) : raw;
        document.getElementById('userModalTitle').textContent = '编辑用户';
        document.getElementById('editingUsername').value = item.username;
        document.getElementById('formUsername').value = item.username;
        document.getElementById('formUsername').disabled = true;
        document.getElementById('formDisplayName').value = item.displayName || '';
        document.getElementById('formEmail').value = item.email || '';
        document.getElementById('formRole').value = item.role || 'user';
        document.getElementById('formPassword').value = '';
        document.getElementById('formPassword').required = false;
        document.getElementById('passwordLabel').textContent = '密码（留空则不修改）';
        userModal.show();
    }

    async function saveUser(e) {
        e.preventDefault();
        const editing = document.getElementById('editingUsername').value;
        const payload = {
            displayName: document.getElementById('formDisplayName').value.trim(),
            email: document.getElementById('formEmail').value.trim(),
            role: document.getElementById('formRole').value,
            password: document.getElementById('formPassword').value
        };

        try {
            if (editing) {
                if (!payload.password) delete payload.password;
                await apiRequest(`/api/users/${encodeURIComponent(editing)}`, {
                    method: 'PUT',
                    headers: authHeaders({'Content-Type': 'application/json'}),
                    body: JSON.stringify(payload)
                });
            } else {
                payload.username = document.getElementById('formUsername').value.trim();
                await apiRequest('/api/users', {
                    method: 'POST',
                    headers: authHeaders({'Content-Type': 'application/json'}),
                    body: JSON.stringify(payload)
                });
            }
            userModal.hide();
            await loadUsers();
        } catch (error) {
            alert(error.message || '保存失败');
        }
    }

    async function deleteUser(encodedUsername) {
        const username = decodeURIComponent(encodedUsername);
        if (!confirm(`确定删除用户 ${username} 吗？`)) return;
        try {
            await apiRequest(`/api/users/${encodeURIComponent(username)}`, {
                method: 'DELETE',
                headers: authHeaders()
            });
            await loadUsers();
        } catch (error) {
            alert(error.message || '删除失败');
        }
    }
</script>
</body>
</html>
