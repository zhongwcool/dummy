<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APK版本管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/admin.css" rel="stylesheet">
    <style>
        .admin-header h1 {
            font-size: 22px;
        }
    </style>
</head>
<body>
<div class="page-shell">
    <div class="admin-header">
        <h1>APK版本管理系统</h1>
    </div>

    <div id="appGrid" class="app-grid">
        <div class="text-center py-5">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">加载中...</span>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', fetchApps);

    async function fetchApps() {
        const grid = document.getElementById('appGrid');
        try {
            const response = await fetch('/api/update/apps');
            const data = await response.json();
            renderApps(data.apps || []);
        } catch (error) {
            grid.innerHTML = '<div class="alert alert-danger">获取应用列表失败，请刷新重试</div>';
        }
    }

    function renderApps(apps) {
        const grid = document.getElementById('appGrid');
        if (!apps.length) {
            grid.innerHTML = '<div class="surface p-4 text-muted">暂无应用版本</div>';
            return;
        }
        grid.innerHTML = apps.map(renderAppColumn).join('');
    }

    function renderAppColumn(app) {
        const versions = [];
        if (app.latest && app.latest.versionCode != null) {
            versions.push(Object.assign({isLatest: true}, app.latest));
        }
        (app.history || []).forEach(function (item) {
            versions.push(Object.assign({isLatest: false}, item));
        });

        const body = versions.length
            ? versions.map(renderVersion).join('')
            : '<div class="text-muted">暂无版本</div>';

        return `
            <section class="app-column">
                <h2>${escapeHtml(app.appName || app.packageName)}</h2>
                <div class="package-name">package name: ${escapeHtml(app.packageName)}</div>
                ${body}
            </section>
        `;
    }

    function renderVersion(version) {
        const dateLabel = version.isLatest ? '上传日期' : '发布日期';
        const dateValue = version.uploadDate || version.releaseDate || '未知日期';
        const fileSize = formatFileSize(version.fileSize);
        const badges = [
            version.isLatest ? '<span class="badge bg-primary">最新</span>' : '',
            version.forceUpdate ? '<span class="badge bg-danger">强制更新</span>' : ''
        ].filter(Boolean).join(' ');

        return `
            <article class="version-item">
                <div class="version-title">${escapeHtml(version.versionName || '')} ${badges}</div>
                <div class="version-meta">版本号: ${escapeHtml(String(version.versionCode))}</div>
                <div class="version-meta">${dateLabel}: ${escapeHtml(dateValue)}</div>
                ${fileSize ? `<div class="version-meta">文件大小: ${escapeHtml(fileSize)}</div>` : ''}
                ${version.md5 ? `<div class="version-meta">MD5: <span class="md5-hash">${escapeHtml(version.md5)}</span></div>` : ''}
                <div class="version-desc">${escapeHtml(version.updateDescription || '').replace(/\n/g, '<br>')}</div>
                <a class="btn btn-success btn-sm" href="${escapeHtml(version.downloadUrl || '#')}" download>下载APK</a>
            </article>
        `;
    }

    function formatFileSize(bytes) {
        if (!bytes) return '';
        const units = ['B', 'KB', 'MB', 'GB'];
        let size = bytes;
        let unitIndex = 0;
        while (size >= 1024 && unitIndex < units.length - 1) {
            size /= 1024;
            unitIndex++;
        }
        return `${size.toFixed(2)} ${units[unitIndex]}`;
    }

    function escapeHtml(text) {
        return String(text == null ? '' : text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }
</script>
</body>
</html>
