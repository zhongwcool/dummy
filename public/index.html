<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APK版本管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/admin.css" rel="stylesheet">
    <style>
        .admin-header h1 {
            font-size: 22px;
        }
    </style>
</head>
<body>
<div class="page-shell public-home">
    <div class="admin-header">
        <h1>APK版本管理系统</h1>
    </div>

    <div id="appGrid" class="app-grid">
        <div class="text-center py-5">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">加载中...</span>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', fetchApps);

    async function fetchApps() {
        const grid = document.getElementById('appGrid');
        try {
            const response = await fetch('/api/update/apps');
            const data = await response.json();
            renderApps(data.apps || []);
        } catch (error) {
            grid.innerHTML = '<div class="alert alert-danger">获取应用列表失败，请刷新重试</div>';
        }
    }

    function renderApps(apps) {
        const grid = document.getElementById('appGrid');
        if (!apps.length) {
            grid.innerHTML = '<div class="surface p-4 text-muted">暂无应用版本</div>';
            return;
        }
        grid.innerHTML = apps.map(renderAppTile).join('');
    }

    function renderAppTile(app) {
        const latestName = app.latest && app.latest.versionName ? app.latest.versionName : '';
        const href = '/details?pn=' + encodeURIComponent(app.packageName);
        return `
            <a class="app-tile" href="${href}">
                <h2>${escapeHtml(app.appName || app.packageName)}</h2>
                <div class="package-name">${escapeHtml(app.packageName)}</div>
                ${latestName ? `<div class="tile-version">${escapeHtml(latestName)}</div>` : ''}
                <span class="entry-go">进入
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
            </a>
        `;
    }

    function escapeHtml(text) {
        return String(text == null ? '' : text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }
</script>
</body>
</html>
